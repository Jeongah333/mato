<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>강아지 똥피하기</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="game" id="game" aria-label="강아지 똥피하기 게임">
        <div class="world" id="world">
          <div class="hud" aria-label="게임 정보">
            <div>
              <span>시간</span>
              <strong id="time">000.0초</strong>
            </div>
            <div>
              <span>최고</span>
              <strong id="best">000.0초</strong>
            </div>
          </div>

          <div class="sun" aria-hidden="true"></div>
          <div class="cloud cloud-one" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="cloud cloud-two" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="cloud cloud-three" aria-hidden="true"><span></span><span></span><span></span></div>

          <div class="dog" id="dog" aria-label="움직이는 강아지">
            <span class="dog-tail"></span>
            <span class="dog-body"></span>
            <span class="dog-head"></span>
            <span class="dog-ear"></span>
            <span class="dog-leg leg-one"></span>
            <span class="dog-leg leg-two"></span>
          </div>

          <div class="poop-layer" id="poopLayer" aria-hidden="true"></div>

          <div class="player" id="player" aria-label="플레이어">
            <span class="player-head"></span>
            <span class="player-hair"></span>
            <span class="player-eye eye-left"></span>
            <span class="player-eye eye-right"></span>
            <span class="player-mouth"></span>
            <span class="player-body"></span>
            <span class="player-arm arm-left"></span>
            <span class="player-arm arm-right"></span>
            <span class="player-leg leg-left"></span>
            <span class="player-leg leg-right"></span>
          </div>

          <div class="ground" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
          <div class="game-over-panel">
            <div class="trophy" aria-hidden="true">★</div>
            <h1>게임오버</h1>
            <p id="finalTime">000.0초 동안 버텼어요</p>
            <button type="button" id="restartButton" aria-label="다시 시작">
              <span aria-hidden="true">↻</span>
              다시 시작
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="./src/app.js"></script>
  </body>
</html>
