<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>&#44053;&#50500;&#51648; &#46629;&#54588;&#54616;&#44592;</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="game" id="game" aria-label="Dog poop dodge game">
        <div class="world" id="world">
          <div class="hud" aria-label="Game info">
            <div>
              <span>&#49884;&#44036;</span>
              <strong id="time">000.0&#52488;</strong>
            </div>
            <div>
              <span>&#52572;&#44256;</span>
              <strong id="best">000.0&#52488;</strong>
            </div>
          </div>

          <div class="sun" aria-hidden="true"></div>
          <div class="cloud cloud-one" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="cloud cloud-two" aria-hidden="true"><span></span><span></span><span></span></div>
          <div class="cloud cloud-three" aria-hidden="true"><span></span><span></span><span></span></div>

          <div class="dog" id="dog" aria-label="Dog">
            <span class="dog-tail"></span>
            <span class="dog-body"></span>
            <span class="dog-head"></span>
            <span class="dog-ear"></span>
            <span class="dog-leg leg-one"></span>
            <span class="dog-leg leg-two"></span>
          </div>

          <div class="poop-layer" id="poopLayer" aria-hidden="true"></div>

          <div class="player" id="player" aria-label="Player">
            <span class="player-head"></span>
            <span class="player-hair"></span>
            <span class="player-eye eye-left"></span>
            <span class="player-eye eye-right"></span>
            <span class="player-mouth"></span>
            <span class="player-body"></span>
            <span class="player-arm arm-left"></span>
            <span class="player-arm arm-right"></span>
            <span class="player-leg leg-left"></span>
            <span class="player-leg leg-right"></span>
          </div>

          <div class="ground" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <div class="overlay hidden" id="overlay" role="dialog" aria-modal="true">
          <div class="game-over-panel">
            <div class="trophy" aria-hidden="true">★</div>
            <h1>&#44172;&#51076;&#50724;&#48260;</h1>
            <p id="finalTime">000.0&#52488; &#46041;&#50504; &#48260;&#54004;&#50612;&#50836;</p>
            <button type="button" id="restartButton" aria-label="Restart">
              <span aria-hidden="true">↻</span>
              &#45796;&#49884; &#49884;&#51089;
            </button>
          </div>
        </div>
      </section>
    </main>
    <script src="./src/app.js"></script>
  </body>
</html>
